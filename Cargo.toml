[workspace]
members = [
  "crates/analysis",
  "crates/stylesheet-parser",
  "crates/typescript-parser",
  "crates/resolver",
  "crates/protocol",
  "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IvanKobtsev/StyleBreeze"

[workspace.dependencies]
anyhow = "1.0"
lsp-server = "0.7.9"
lsp-types = "0.95.1"
oxc_allocator = "0.75.1"
oxc_parser = "0.75.1"
oxc_span = "0.75.1"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2.5"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

