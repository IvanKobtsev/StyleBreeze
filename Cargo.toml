[workspace]
members = ["crates/style-breeze-lsp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IvanKobtsev/StyleBreeze"

[workspace.dependencies]
anyhow = "1.0"
lsp-server = "0.7"
lsp-types = "0.95.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
style-contract = { path = "../StyleContract" }
url = "2.5"

[profile.release]
lto = "thin"
strip = true
