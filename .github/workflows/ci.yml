name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p stylebreeze --release
      - name: Upload StyleBreeze server
        uses: actions/upload-artifact@v4
        with:
          name: stylebreeze-server-${{ matrix.os }}
          path: |
            target/release/stylebreeze
            target/release/stylebreeze.exe
          if-no-files-found: error
  intellij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle -p editors/intellij test buildPlugin
      - name: Upload WebStorm plugin
        uses: actions/upload-artifact@v4
        with:
          name: stylebreeze-webstorm-plugin
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error
