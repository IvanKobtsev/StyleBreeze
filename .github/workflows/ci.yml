name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p stylebreeze --release
      - name: Upload StyleBreeze server
        uses: actions/upload-artifact@v4
        with:
          name: stylebreeze-server-${{ matrix.os }}
          path: |
            target/release/stylebreeze
            target/release/stylebreeze.exe
          if-no-files-found: error
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run compile
  editor-binaries:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, binary: stylebreeze.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, binary: stylebreeze.exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, binary: stylebreeze }
          - { os: macos-14, target: aarch64-apple-darwin, binary: stylebreeze }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, binary: stylebreeze }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, binary: stylebreeze, cross: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - if: matrix.cross == 'arm64'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p stylebreeze --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: stylebreeze-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
  vscode-package:
    needs: [vscode, editor-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
        working-directory: editors/vscode
      - name: Download Windows x64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-x86_64-pc-windows-msvc
          path: vscode-binaries/win32-x64
      - name: Download Windows ARM64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-aarch64-pc-windows-msvc
          path: vscode-binaries/win32-arm64
      - name: Download macOS x64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-x86_64-apple-darwin
          path: vscode-binaries/darwin-x64
      - name: Download macOS ARM64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-aarch64-apple-darwin
          path: vscode-binaries/darwin-arm64
      - name: Download Linux x64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-x86_64-unknown-linux-gnu
          path: vscode-binaries/linux-x64
      - name: Download Linux ARM64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-aarch64-unknown-linux-gnu
          path: vscode-binaries/linux-arm64
      - name: Mark Unix language servers executable
        run: chmod +x vscode-binaries/{darwin-x64,darwin-arm64,linux-x64,linux-arm64}/stylebreeze
      - run: pnpm run compile
        working-directory: editors/vscode
      - name: Package every VS Code platform
        working-directory: editors/vscode
        run: |
          for platform in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            rm -rf bin
            mkdir -p "bin/$platform"
            cp "../../vscode-binaries/$platform/"* "bin/$platform/"
            pnpm exec vsce package --no-dependencies --target "$platform" --out "stylebreeze-$platform.vsix"
          done
      - name: Bundle VS Code extensions
        working-directory: editors/vscode
        run: zip -j stylebreeze-vscode-extensions.zip stylebreeze-*.vsix
      - name: Upload VS Code extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: stylebreeze-vscode-extensions
          path: editors/vscode/stylebreeze-vscode-extensions.zip
          if-no-files-found: error
  intellij:
    needs: [rust, editor-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows x64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-x86_64-pc-windows-msvc
          path: editors/intellij/src/main/resources/bin/windows-x64
      - name: Download Windows ARM64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-aarch64-pc-windows-msvc
          path: editors/intellij/src/main/resources/bin/windows-arm64
      - name: Download macOS x64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-x86_64-apple-darwin
          path: editors/intellij/src/main/resources/bin/macos-x64
      - name: Download macOS ARM64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-aarch64-apple-darwin
          path: editors/intellij/src/main/resources/bin/macos-arm64
      - name: Download Linux x64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-x86_64-unknown-linux-gnu
          path: editors/intellij/src/main/resources/bin/linux-x64
      - name: Download Linux ARM64 language server
        uses: actions/download-artifact@v4
        with:
          name: stylebreeze-aarch64-unknown-linux-gnu
          path: editors/intellij/src/main/resources/bin/linux-arm64
      - name: Mark Unix language servers executable
        run: chmod +x editors/intellij/src/main/resources/bin/{macos-x64,macos-arm64,linux-x64,linux-arm64}/stylebreeze
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle -p editors/intellij test buildPlugin verifyBundledBinaries
      - name: Upload WebStorm plugin
        uses: actions/upload-artifact@v4
        with:
          name: stylebreeze-webstorm-plugin
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error
