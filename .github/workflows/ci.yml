name: CI
on:
  push:
  pull_request:
  workflow_call:

jobs:
  rust:
    strategy:
      matrix: { os: [windows-latest, macos-latest, ubuntu-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: StyleBreeze }
      - uses: actions/checkout@v4
        with:
          repository: IvanKobtsev/StyleContract
          ref: 9c57f44ab4aa81bc33f45b7f4dd0889a339c5d0a
          path: StyleContract
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all --check
        working-directory: StyleBreeze
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: StyleBreeze
      - run: cargo test --workspace --all-targets
        working-directory: StyleBreeze

  binaries:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64, ext: .exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, platform: win32-arm64, ext: .exe }
          - { os: macos-15-intel, target: x86_64-apple-darwin, platform: darwin-x64, ext: "" }
          - { os: macos-14, target: aarch64-apple-darwin, platform: darwin-arm64, ext: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64, ext: "" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, platform: linux-arm64, ext: "", cross: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: StyleBreeze }
      - uses: actions/checkout@v4
        with:
          repository: IvanKobtsev/StyleContract
          ref: 9c57f44ab4aa81bc33f45b7f4dd0889a339c5d0a
          path: StyleContract
      - uses: dtolnay/rust-toolchain@1.97.1
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - if: matrix.cross == 'arm64'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p style-breeze --target ${{ matrix.target }}
        working-directory: StyleBreeze
      - uses: actions/upload-artifact@v4
        with:
          name: style-breeze-${{ matrix.platform }}
          path: StyleBreeze/target/${{ matrix.target }}/release/style-breeze${{ matrix.ext }}

  package-webstorm:
    needs: [rust, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: StyleBreeze }
      - uses: actions/checkout@v4
        with:
          repository: IvanKobtsev/StyleContract
          ref: 9c57f44ab4aa81bc33f45b7f4dd0889a339c5d0a
          path: StyleContract
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.4.1' }
      - uses: actions/download-artifact@v4
        with: { path: StyleBreeze/artifacts }
      - name: Stage native executables
        working-directory: StyleBreeze
        run: |
          for platform in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do mkdir -p "dist/jetbrains/$platform"; done
          cp artifacts/style-breeze-win32-x64/style-breeze.exe dist/jetbrains/win32-x64/
          cp artifacts/style-breeze-win32-arm64/style-breeze.exe dist/jetbrains/win32-arm64/
          for platform in darwin-x64 darwin-arm64 linux-x64 linux-arm64; do cp "artifacts/style-breeze-$platform/style-breeze" "dist/jetbrains/$platform/"; chmod +x "dist/jetbrains/$platform/style-breeze"; done
      - run: node scripts/package-webstorm.mjs
        working-directory: StyleBreeze
      - uses: actions/upload-artifact@v4
        with:
          name: style-breeze-webstorm-extension
          path: StyleBreeze/dist/editors/style-breeze-webstorm-*.zip
          if-no-files-found: error
